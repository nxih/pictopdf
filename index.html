<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F2F2F7">
    <title>PicToPDF Ultra</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/337/337946.png">
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom); 
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile PWA */
        }
        .glass { background: rgba(255, 255, 255, 0.90); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glass-dark { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .btn-active:active { transform: scale(0.96); opacity: 0.8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .crop-stage {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .crop-photo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 140ms ease, transform 180ms cubic-bezier(0.2, 0, 0, 1);
        }
        .crop-overlay {
            position: absolute;
            inset: 0;
            touch-action: none;
        }
        .crop-outline {
            fill: rgba(79, 70, 229, 0.12);
            stroke: #ffffff;
            stroke-width: 2.5;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.6));
        }
        .crop-mask {
            fill: rgba(0, 0, 0, 0.58);
            fill-rule: evenodd;
        }
        .crop-handle {
            cursor: grab;
            touch-action: none;
        }
        .crop-handle-active {
            cursor: grabbing;
        }
        .crop-handle-dot,
        .crop-edge-handle {
            fill: #ffffff;
            stroke: #4f46e5;
            stroke-width: 2.5;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
            pointer-events: none;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 120ms ease, fill 120ms ease, stroke-width 120ms ease;
        }
        .crop-handle-hit {
            fill: rgba(0, 0, 0, 0);
            pointer-events: all;
            touch-action: none;
        }
        .crop-handle-active .crop-handle-dot {
            fill: #eef2ff;
            transform: scale(1.22);
        }
        .crop-handle-active .crop-edge-handle {
            fill: #eef2ff;
            stroke-width: 3;
            transform: scaleY(1.22);
        }
        .straighten-track {
            height: 42px;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.22) 0,
                    rgba(255,255,255,0.22) 1px,
                    transparent 1px,
                    transparent calc(100% / 30)
                );
            mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent);
            -webkit-mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent);
        }
        .straighten-slider {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            touch-action: pan-x;
        }
        .straighten-slider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 4px;
            height: 46px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.25), 0 10px 24px rgba(0,0,0,0.35);
        }
        .straighten-slider::-moz-range-thumb {
            width: 4px;
            height: 46px;
            border: 0;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.25), 0 10px 24px rgba(0,0,0,0.35);
        }
        .straighten-slider::-webkit-slider-runnable-track { height: 46px; }
        .straighten-slider::-moz-range-track { height: 46px; background: transparent; }
        #crop-modal button:disabled, #crop-modal input:disabled {
            opacity: 0.45;
            pointer-events: none;
        }
        #rotate-btn svg {
            transform-origin: center;
            will-change: transform;
        }
        #rotate-btn.rotate-tap svg {
            animation: rotate-tap 220ms cubic-bezier(0.2, 0, 0, 1);
        }
        @keyframes rotate-tap {
            from { transform: rotate(0deg) scale(0.92); }
            to { transform: rotate(90deg) scale(1); }
        }

        /* Premium Drag & Drop Reordering Styles */
        .grid-item-card {
            touch-action: pan-y; /* Allow vertical scroll, but capture press-and-hold */
            -webkit-touch-callout: none; /* Prevent iOS native image menu */
            user-select: none;
            -webkit-user-select: none;
        }
        .sortable-chosen {
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 50;
            border-color: #4f46e5;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
        }
        .sortable-ghost {
            opacity: 0.5;
            background-color: #e0e7ff !important; /* indigo-100 */
            border: 2px dashed #4f46e5 !important; /* indigo-600 */
            transform: scale(0.95);
            border-radius: 1rem;
        }
        .sortable-ghost img, .sortable-ghost div, .sortable-ghost button {
            opacity: 0 !important; /* Hide content in the placeholder drop zone */
        }
        .sortable-fallback {
            opacity: 0.95 !important;
            cursor: grabbing !important;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body class="bg-[#F2F2F7] font-sans text-slate-900 min-h-screen selection:bg-indigo-100">

    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-slate-200/50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex flex-col">
            <h1 class="text-xl font-extrabold tracking-tight text-indigo-600 flex items-center gap-1">
                PicToPDF <span class="text-indigo-400">Ultra</span>
            </h1>
            <p class="text-[9px] text-slate-400 font-mono leading-none font-bold tracking-wider mt-0.5">
                BUILD: <span id="build-hash" class="text-slate-500">LOADING...</span>
            </p>
        </div>
        <div id="offline-indicator" class="hidden flex items-center gap-1.5 bg-green-50 px-3 py-1.5 rounded-full">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
            <span class="text-[9px] text-green-700 font-bold uppercase tracking-widest">Ready</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-5 max-w-2xl mx-auto space-y-6 pb-48">
        
        <!-- Upload Area -->
        <div class="relative group active:scale-[0.98] transition-transform duration-200">
            <input type="file" id="image-input" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer">
            <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-3xl p-8 text-center shadow-sm flex flex-col items-center justify-center gap-2 transition-colors group-hover:bg-indigo-100">
                <div class="bg-white p-4 rounded-full shadow-sm text-indigo-600 mb-1">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <span class="text-indigo-900 font-extrabold text-lg">Add Photos</span>
                <p class="text-indigo-400 text-xs font-semibold">Tap to select & crop from Gallery</p>
            </div>
        </div>

        <!-- Settings Panel -->
        <section id="settings-area" class="hidden bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="grid grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Scale Mode</label>
                    <div class="relative">
                        <select id="setting-fit" class="w-full bg-slate-50 border border-slate-100 rounded-xl p-3 text-sm font-bold outline-none appearance-none focus:ring-2 ring-indigo-500 transition-shadow">
                            <option value="contain">Original Aspect</option>
                            <option value="stretch">Stretch to Fit</option>
                            <option value="cover">Fill Page (Crop)</option>
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider flex justify-between">
                        <span>Margin</span>
                        <span id="margin-val" class="text-indigo-600">10mm</span>
                    </label>
                    <input type="range" id="setting-margin" min="0" max="30" value="10" class="w-full mt-2 accent-indigo-600" oninput="document.getElementById('margin-val').innerText = this.value + 'mm';">
                </div>
            </div>
        </section>

        <!-- Image Grid (Sortable) -->
        <div id="preview-grid" class="grid grid-cols-3 gap-3"></div>
    </main>

    <!-- Crop Modal -->
    <div id="crop-modal" class="fixed inset-0 z-[70] bg-black hidden flex-col transition-opacity duration-300">
        <div class="pt-[max(env(safe-area-inset-top),1rem)] pb-4 px-6 flex justify-between items-center text-white border-b border-white/10 glass-dark">
            <button id="crop-cancel-btn" onclick="cancelCropQueue()" class="text-sm font-bold text-red-400 active:opacity-70 transition-opacity p-2 -ml-2">Cancel</button>
            <h2 id="crop-title" class="font-bold text-lg tracking-tight">Crop Photo</h2>
            <button id="crop-skip-btn" onclick="skipCrop()" class="text-sm font-bold text-slate-300 active:opacity-70 transition-opacity p-2 -mr-2">Skip</button>
        </div>
        
        <div id="crop-stage" class="crop-stage flex-1 min-h-0 relative bg-black overflow-hidden w-full flex items-center justify-center">
            <img id="crop-image" class="crop-photo block" draggable="false" src="">
            <svg id="crop-overlay" class="crop-overlay" aria-hidden="true"></svg>
        </div>

        <div class="shrink-0 pb-[max(env(safe-area-inset-bottom),1.25rem)] pt-4 px-5 sm:px-6 border-t border-white/10 glass-dark space-y-4">
            <div class="space-y-2">
                <div class="flex items-center justify-between text-white">
                    <button id="straighten-reset-btn" type="button" onclick="resetPhotoEdits()" class="text-xs font-black uppercase tracking-widest text-slate-300 active:opacity-70 px-2 py-2 -ml-2">Reset</button>
                    <div class="flex flex-col items-center leading-none">
                        <span class="text-[10px] font-black uppercase tracking-[0.22em] text-slate-400">Straighten</span>
                        <span id="straighten-val" class="text-lg font-black tabular-nums mt-1">0.0&deg;</span>
                    </div>
                    <button id="rotate-btn" type="button" onclick="rotateImage()" aria-label="Rotate photo clockwise" class="w-12 h-12 rounded-full bg-white/10 text-white flex items-center justify-center active:scale-95 active:bg-white/20 transition-all -mr-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.8 13A7.2 7.2 0 1 0 7 7.8L4 10.8"></path>
                        </svg>
                    </button>
                </div>
                <div class="relative h-12 flex items-center">
                    <div class="straighten-track absolute inset-x-0 top-1/2 -translate-y-1/2"></div>
                    <div class="absolute left-1/2 top-0 bottom-0 w-px bg-indigo-400/90 shadow-[0_0_14px_rgba(129,140,248,0.9)] pointer-events-none"></div>
                    <input type="range" id="straighten-slider" min="-45" max="45" step="0.1" value="0" oninput="handleStraightenInput(this.value)" class="straighten-slider relative z-10 w-full h-12">
                </div>
            </div>
            <button id="crop-btn" onclick="confirmCrop()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-full py-4 rounded-2xl font-black shadow-xl btn-active flex justify-center items-center gap-2 text-lg transition-colors">
                <span id="crop-btn-text">Crop & Next</span>
                <div id="crop-loader" class="hidden border-2 border-white/30 border-t-white h-5 w-5 rounded-full animate-spin"></div>
            </button>
        </div>
    </div>

    <!-- Live Preview & Export Modal -->
    <div id="preview-modal" class="fixed inset-0 z-[60] bg-slate-900 hidden flex-col translate-y-full transition-transform duration-300 ease-in-out">
        <div class="shrink-0 pt-[max(env(safe-area-inset-top),1rem)] pb-4 px-6 flex justify-between items-center text-white border-b border-white/10 glass-dark">
            <button onclick="closePreview()" class="text-sm font-bold text-slate-300 active:opacity-70 p-2 -ml-2 flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Back
            </button>
            <div class="flex flex-col items-center">
                <h2 class="font-bold text-lg tracking-tight">PDF Preview</h2>
                <span class="text-[9px] text-indigo-300 font-bold uppercase tracking-widest bg-indigo-900/50 px-2 py-0.5 rounded mt-0.5">Draft Layout</span>
            </div>
            <div class="w-12"></div>
        </div>
        
        <div id="preview-scroll" class="flex-1 overflow-y-auto p-8 space-y-10 flex flex-col items-center no-scrollbar relative"></div>

        <div class="shrink-0 pb-[max(env(safe-area-inset-bottom),1.5rem)] pt-4 px-6 border-t border-white/10 glass-dark">
            <button id="modal-export-btn" onclick="generateAndSharePDF()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-full py-4 rounded-2xl font-black shadow-xl shadow-indigo-600/20 active:scale-[0.98] transition-all flex justify-center items-center gap-3 text-lg">
                <span id="export-btn-text">SAVE PDF</span>
                <div id="modal-loader" class="hidden border-2 border-white/30 border-t-white h-5 w-5 rounded-full animate-spin"></div>
            </button>
        </div>
    </div>

    <!-- Main Screen Action Bar -->
    <footer id="action-bar" class="hidden fixed bottom-0 left-0 right-0 glass border-t border-slate-200/50 p-6 pb-[max(env(safe-area-inset-bottom),1.5rem)] z-40">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex flex-col">
                <p id="stats" class="text-base font-black text-slate-800 tracking-tighter">0 PHOTOS</p>
                <p id="stats-subtext" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-0.5 transition-colors">Ready for review</p>
            </div>
            
            <button id="preview-flow-btn" onclick="openPreview()" class="bg-indigo-600 text-white px-7 py-4 rounded-2xl font-black shadow-xl shadow-indigo-600/20 btn-active flex items-center gap-2 transition-colors hover:bg-indigo-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <span>PREVIEW & EXPORT</span>
            </button>
        </div>
    </footer>

    <script>
        // --- Fetch Latest Commit Hash ---
        document.addEventListener("DOMContentLoaded", () => {
            fetch('https://api.github.com/repos/nxih/pictopdf/commits/main')
                .then(response => response.json())
                .then(data => {
                    const hashEl = document.getElementById('build-hash');
                    if (data && data.sha) hashEl.innerText = data.sha.substring(0, 7);
                    else hashEl.innerText = 'UNKNOWN';
                })
                .catch(() => document.getElementById('build-hash').innerText = 'LOCAL');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(reg => {
                if(reg) document.getElementById('offline-indicator').classList.remove('hidden');
            });
        }

        const { jsPDF } = window.jspdf;
        
        let images = [];
        let cropQueue = [];
        let totalCropItems = 0;
        let currentCropIndex = 0;
        let currentOriginalFile = null;
        let currentOriginalDataUrl = '';
        let currentEditorSourceDataUrl = '';
        let currentOriginalName = '';
        let currentEditorMode = 'add';
        let editingImageIndex = -1;
        let currentStraightenAngle = 0;
        let currentRotateDegrees = 0;
        let pendingCropPoints = null;
        let currentCropPoints = null;
        let activeCropHandle = null;
        let dragStartPoints = null;
        let dragStartPointer = null;
        let imageDisplayRect = null;
        let editorLoadToken = 0;
        let straightenReloadTimer = null;
        let sortableInstance = null;
        let isSorting = false;

        const MAX_IMAGE_SIZE = 2048;
        const STRAIGHTEN_SNAP_DEGREES = 0.5;

        const isDesktop = window.matchMedia("(min-width: 1024px) or ((hover: hover) and (pointer: fine))").matches;

        document.addEventListener("DOMContentLoaded", () => {
            if (isDesktop) document.getElementById('export-btn-text').innerText = "DOWNLOAD PDF";
        });

        const input = document.getElementById('image-input');
        const grid = document.getElementById('preview-grid');
        const modalPreview = document.getElementById('preview-modal');
        const scrollContainer = document.getElementById('preview-scroll');
        const modalCrop = document.getElementById('crop-modal');

        window.addEventListener('resize', () => {
            if (modalCrop.classList.contains('hidden')) return;
            updateImageDisplayRect();
            renderCropOverlay();
        });

        // --- Init Premium Mobile Drag & Drop ---
        document.addEventListener("DOMContentLoaded", () => {
            sortableInstance = new Sortable(grid, {
                animation: 250,
                easing: "cubic-bezier(0.2, 0, 0, 1)",
                delay: 200, // Important: 200ms delay requires intent, allowing normal page scroll on mobile
                delayOnTouchOnly: true,
                touchStartThreshold: 5,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                forceFallback: true, // Overrides the native OS drag image for complete styling control
                fallbackClass: 'sortable-fallback',
                fallbackOnBody: true,
                filter: '.no-drag', // Do not pick up the item if they click the remove button
                preventOnFilter: false,
                onStart: function () {
                    isSorting = true;
                },
                onEnd: function (evt) {
                    if (evt.oldIndex !== evt.newIndex) {
                        const item = images.splice(evt.oldIndex, 1)[0];
                        images.splice(evt.newIndex, 0, item);
                        setTimeout(updateUI, 0);
                    }
                    setTimeout(() => { isSorting = false; }, 120);
                }
            });
        });

        input.onchange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            
            cropQueue = files;
            totalCropItems = files.length;
            currentCropIndex = 1;
            e.target.value = ''; 
            processNextCrop();
        };

        async function processNextCrop() {
            if (cropQueue.length === 0) {
                closeCropModal();
                updateUI();
                return;
            }

            currentOriginalFile = cropQueue.shift();
            try {
                const sourceDataUrl = await readFileAsDataUrl(currentOriginalFile);
                await openImageEditor({
                    mode: 'add',
                    sourceDataUrl,
                    originalName: currentOriginalFile.name || '',
                    title: `Crop (${currentCropIndex}/${totalCropItems})`,
                    confirmText: cropQueue.length > 0 ? 'Crop & Next' : 'Crop & Done',
                    cropPoints: null,
                    straighten: 0,
                    rotateDegrees: 0
                });
            } catch (error) {
                console.error("Image Load Error", error);
                alert("Could not load that photo.");
                currentCropIndex++;
                processNextCrop();
            }
        }

        async function openImageEditor({ mode, sourceDataUrl, originalName, title, confirmText, cropPoints, straighten, rotateDegrees, index = -1 }) {
            currentEditorMode = mode;
            editingImageIndex = index;
            currentOriginalDataUrl = sourceDataUrl;
            currentOriginalName = originalName || '';
            pendingCropPoints = sanitizeCropPoints(cropPoints);
            currentRotateDegrees = normalizeRotateDegrees(rotateDegrees || 0);

            document.getElementById('crop-title').innerText = title;
            document.getElementById('crop-btn-text').innerText = confirmText;
            document.getElementById('crop-skip-btn').classList.toggle('invisible', mode === 'edit');
            setStraightenAngle(straighten || 0, false);

            openCropModal();
            await loadCropEditorForCurrentState({ restoreCropPoints: !!pendingCropPoints });
        }

        async function loadCropEditorForCurrentState({ restoreCropPoints }) {
            const loadToken = ++editorLoadToken;
            const imageEl = document.getElementById('crop-image');
            setCropControlsDisabled(true);
            clearTimeout(straightenReloadTimer);
            activeCropHandle = null;
            dragStartPoints = null;
            dragStartPointer = null;
            imageDisplayRect = null;
            currentCropPoints = restoreCropPoints && pendingCropPoints ? cloneCropPoints(pendingCropPoints) : defaultCropPoints();
            renderCropOverlay();
            imageEl.removeAttribute('src');
            imageEl.style.opacity = '0';

            try {
                currentEditorSourceDataUrl = await buildEditorSourceDataUrl(currentOriginalDataUrl, currentRotateDegrees, currentStraightenAngle);
            } catch (error) {
                console.error("Rotate Source Error", error);
                alert("Could not rotate that photo.");
                setCropControlsDisabled(false);
                return;
            }

            if (loadToken !== editorLoadToken) return;

            return new Promise((resolve) => {
                imageEl.onload = () => {
                    if (loadToken !== editorLoadToken) {
                        resolve();
                        return;
                    }

                    imageEl.style.opacity = '1';
                    window.requestAnimationFrame(() => {
                        updateImageDisplayRect();
                        renderCropOverlay();
                        setCropControlsDisabled(false);
                        resolve();
                    });
                };
                imageEl.onerror = () => {
                    setCropControlsDisabled(false);
                    resolve();
                };
                imageEl.src = currentEditorSourceDataUrl;
            });
        }

        async function editImg(i) {
            if (isSorting || !images[i]) return;
            const img = images[i];
            await openImageEditor({
                mode: 'edit',
                sourceDataUrl: img.originalDataUrl || img.dataUrl,
                originalName: img.originalName || '',
                title: `Edit Photo ${i + 1}`,
                confirmText: 'Update Photo',
                cropPoints: img.edit ? img.edit.cropPoints : null,
                straighten: img.edit ? img.edit.straighten : 0,
                rotateDegrees: img.edit ? img.edit.rotateDegrees : 0,
                index: i
            });
        }

        function openCropModal() {
            modalCrop.classList.remove('hidden');
            modalCrop.classList.add('flex');
            document.body.style.overflow = 'hidden'; 
        }

        function closeCropModal() {
            modalCrop.classList.add('hidden');
            modalCrop.classList.remove('flex');
            document.body.style.overflow = '';
            clearTimeout(straightenReloadTimer);
            editorLoadToken++;
            currentCropPoints = null;
            activeCropHandle = null;
            window.removeEventListener('pointermove', moveCropHandle);
            window.removeEventListener('pointerup', stopCropHandleDrag);
            window.removeEventListener('pointercancel', stopCropHandleDrag);
            renderCropOverlay();
            pendingCropPoints = null;
        }

        function cancelCropQueue() {
            if (currentEditorMode === 'add') cropQueue = [];
            closeCropModal();
            updateUI(); 
        }

        async function skipCrop() {
            if (currentEditorMode === 'edit') return;
            showCropLoading(true);
            const imgData = await buildOriginalImageRecord(currentOriginalDataUrl, currentOriginalName);
            images.push(imgData);
            currentCropIndex++;
            await processNextCrop();
            showCropLoading(false);
        }

        async function confirmCrop() {
            if (!currentCropPoints || !currentEditorSourceDataUrl) return;
            showCropLoading(true);
            await new Promise(r => setTimeout(r, 50));
            let rendered;
            try {
                rendered = await renderPerspectiveCrop(currentEditorSourceDataUrl, currentCropPoints);
            } catch (error) {
                console.error("Perspective Crop Error", error);
                rendered = null;
            }
            if (!rendered) {
                showCropLoading(false);
                alert("Could not crop that photo.");
                return;
            }

            const record = {
                dataUrl: rendered.dataUrl,
                w: rendered.w,
                h: rendered.h,
                originalDataUrl: currentOriginalDataUrl,
                originalName: currentOriginalName,
                edit: {
                    cropPoints: cloneCropPoints(currentCropPoints),
                    straighten: currentStraightenAngle,
                    rotateDegrees: currentRotateDegrees
                }
            };

            if (currentEditorMode === 'edit' && editingImageIndex > -1) {
                images.splice(editingImageIndex, 1, record);
                closeCropModal();
                updateUI();
            } else {
                images.push(record);
                currentCropIndex++;
                await processNextCrop();
            }

            showCropLoading(false);
        }

        function showCropLoading(show) {
            const loader = document.getElementById('crop-loader');
            setCropControlsDisabled(show);
            if (show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        function setCropControlsDisabled(show) {
            const btn = document.getElementById('crop-btn');
            const skipBtn = document.getElementById('crop-skip-btn');
            const cancelBtn = document.getElementById('crop-cancel-btn');
            const slider = document.getElementById('straighten-slider');
            const resetBtn = document.getElementById('straighten-reset-btn');
            const rotateBtn = document.getElementById('rotate-btn');
            if (show) {
                btn.disabled = true;
                skipBtn.disabled = true;
                cancelBtn.disabled = true;
                slider.disabled = true;
                resetBtn.disabled = true;
                rotateBtn.disabled = true;
            } else {
                btn.disabled = false;
                skipBtn.disabled = false;
                cancelBtn.disabled = false;
                slider.disabled = false;
                resetBtn.disabled = false;
                rotateBtn.disabled = false;
            }
        }

        function handleStraightenInput(value) {
            setStraightenAngle(value, true);
        }

        async function resetPhotoEdits() {
            currentRotateDegrees = 0;
            pendingCropPoints = null;
            currentCropPoints = defaultCropPoints();
            setStraightenAngle(0, false);
            await loadCropEditorForCurrentState({ restoreCropPoints: false });
        }

        async function rotateImage() {
            currentRotateDegrees = normalizeRotateDegrees(currentRotateDegrees + 90);
            pendingCropPoints = null;
            currentCropPoints = defaultCropPoints();
            animateRotateButton();
            await loadCropEditorForCurrentState({ restoreCropPoints: false });
        }

        function setStraightenAngle(value, syncEditor) {
            let nextAngle = Math.max(-45, Math.min(45, parseFloat(value) || 0));
            if (Math.abs(nextAngle) <= STRAIGHTEN_SNAP_DEGREES) nextAngle = 0;
            currentStraightenAngle = nextAngle;
            document.getElementById('straighten-slider').value = nextAngle.toFixed(1);
            document.getElementById('straighten-val').innerText = `${nextAngle.toFixed(1)}\u00B0`;
            if (syncEditor) scheduleStraightenRebuild();
        }

        function scheduleStraightenRebuild() {
            if (!currentOriginalDataUrl) return;
            clearTimeout(straightenReloadTimer);
            straightenReloadTimer = setTimeout(() => {
                pendingCropPoints = currentCropPoints ? cloneCropPoints(currentCropPoints) : null;
                loadCropEditorForCurrentState({ restoreCropPoints: !!pendingCropPoints });
            }, 90);
        }

        function updateImageDisplayRect() {
            const stage = document.getElementById('crop-stage');
            const imageEl = document.getElementById('crop-image');
            if (!imageEl.naturalWidth || !imageEl.naturalHeight) {
                imageDisplayRect = null;
                return;
            }
            const stageRect = stage.getBoundingClientRect();
            const imageAspect = imageEl.naturalWidth / imageEl.naturalHeight;
            const stageAspect = stageRect.width / stageRect.height;
            let width;
            let height;

            if (imageAspect > stageAspect) {
                width = stageRect.width;
                height = width / imageAspect;
            } else {
                height = stageRect.height;
                width = height * imageAspect;
            }

            imageDisplayRect = {
                left: (stageRect.width - width) / 2,
                top: (stageRect.height - height) / 2,
                width,
                height
            };
        }

        function renderCropOverlay() {
            const overlay = document.getElementById('crop-overlay');
            if (!overlay) return;

            const stage = document.getElementById('crop-stage');
            const stageRect = stage.getBoundingClientRect();
            overlay.setAttribute('viewBox', `0 0 ${stageRect.width || 1} ${stageRect.height || 1}`);

            if (!currentCropPoints || !imageDisplayRect) {
                overlay.innerHTML = '';
                return;
            }

            const points = cropPointsToStage(currentCropPoints);
            const handles = getCropHandles(points);
            const path = [
                `M0 0H${stageRect.width}V${stageRect.height}H0Z`,
                `M${points.tl.x} ${points.tl.y}L${points.tr.x} ${points.tr.y}L${points.br.x} ${points.br.y}L${points.bl.x} ${points.bl.y}Z`
            ].join('');

            overlay.innerHTML = `
                <path class="crop-mask" d="${path}"></path>
                <polygon class="crop-outline" points="${points.tl.x},${points.tl.y} ${points.tr.x},${points.tr.y} ${points.br.x},${points.br.y} ${points.bl.x},${points.bl.y}"></polygon>
            `;

            handles.forEach((handle) => {
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const hit = handle.type === 'corner'
                    ? document.createElementNS('http://www.w3.org/2000/svg', 'circle')
                    : document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                const visible = handle.type === 'corner'
                    ? document.createElementNS('http://www.w3.org/2000/svg', 'circle')
                    : document.createElementNS('http://www.w3.org/2000/svg', 'rect');

                group.setAttribute('class', `crop-handle${activeCropHandle === handle.name ? ' crop-handle-active' : ''}`);
                group.setAttribute('transform', `translate(${handle.x} ${handle.y}) rotate(${handle.angle || 0})`);
                group.dataset.handle = handle.name;
                group.addEventListener('pointerdown', startCropHandleDrag);

                if (handle.type === 'corner') {
                    visible.setAttribute('class', 'crop-handle-dot');
                    visible.setAttribute('cx', '0');
                    visible.setAttribute('cy', '0');
                    visible.setAttribute('r', '7');

                    hit.setAttribute('cx', '0');
                    hit.setAttribute('cy', '0');
                    hit.setAttribute('r', '25');
                } else {
                    visible.setAttribute('class', 'crop-edge-handle');
                    visible.setAttribute('x', '-15');
                    visible.setAttribute('y', '-4');
                    visible.setAttribute('width', '30');
                    visible.setAttribute('height', '8');
                    visible.setAttribute('rx', '4');
                    visible.setAttribute('ry', '4');

                    hit.setAttribute('x', '-27');
                    hit.setAttribute('y', '-22');
                    hit.setAttribute('width', '54');
                    hit.setAttribute('height', '44');
                    hit.setAttribute('rx', '16');
                    hit.setAttribute('ry', '16');
                }

                hit.setAttribute('class', 'crop-handle-hit');

                group.appendChild(visible);
                group.appendChild(hit);
                overlay.appendChild(group);
            });
        }

        function startCropHandleDrag(event) {
            if (!currentCropPoints || !imageDisplayRect) return;
            event.preventDefault();
            activeCropHandle = event.currentTarget.dataset.handle;
            dragStartPoints = cloneCropPoints(currentCropPoints);
            dragStartPointer = pointerEventToNormalizedPoint(event);
            event.currentTarget.setPointerCapture(event.pointerId);
            window.addEventListener('pointermove', moveCropHandle);
            window.addEventListener('pointerup', stopCropHandleDrag, { once: true });
            window.addEventListener('pointercancel', stopCropHandleDrag, { once: true });
            renderCropOverlay();
        }

        function moveCropHandle(event) {
            if (!activeCropHandle || !dragStartPoints || !dragStartPointer) return;
            event.preventDefault();
            const pointer = pointerEventToNormalizedPoint(event);
            const nextPoints = cloneCropPoints(dragStartPoints);

            if (['tl', 'tr', 'br', 'bl'].includes(activeCropHandle)) {
                nextPoints[activeCropHandle] = pointer;
            } else {
                moveCropEdge(nextPoints, pointer);
            }

            if (isValidCropPoints(nextPoints)) {
                currentCropPoints = nextPoints;
                renderCropOverlay();
            }
        }

        function stopCropHandleDrag() {
            activeCropHandle = null;
            dragStartPoints = null;
            dragStartPointer = null;
            window.removeEventListener('pointermove', moveCropHandle);
            window.removeEventListener('pointerup', stopCropHandleDrag);
            window.removeEventListener('pointercancel', stopCropHandleDrag);
            renderCropOverlay();
        }

        function moveCropEdge(points, pointer) {
            const edges = {
                top: ['tl', 'tr'],
                right: ['tr', 'br'],
                bottom: ['br', 'bl'],
                left: ['bl', 'tl']
            };
            const edge = edges[activeCropHandle];
            if (!edge) return;

            const a = dragStartPoints[edge[0]];
            const b = dragStartPoints[edge[1]];
            const edgeVector = { x: b.x - a.x, y: b.y - a.y };
            const length = Math.hypot(edgeVector.x, edgeVector.y) || 1;
            const normal = { x: -edgeVector.y / length, y: edgeVector.x / length };
            const delta = { x: pointer.x - dragStartPointer.x, y: pointer.y - dragStartPointer.y };
            const distance = delta.x * normal.x + delta.y * normal.y;
            const offset = { x: normal.x * distance, y: normal.y * distance };

            edge.forEach((name) => {
                points[name] = clampPoint({
                    x: dragStartPoints[name].x + offset.x,
                    y: dragStartPoints[name].y + offset.y
                });
            });
        }

        function pointerEventToNormalizedPoint(event) {
            const stage = document.getElementById('crop-stage');
            const stageRect = stage.getBoundingClientRect();
            const x = (event.clientX - stageRect.left - imageDisplayRect.left) / imageDisplayRect.width;
            const y = (event.clientY - stageRect.top - imageDisplayRect.top) / imageDisplayRect.height;
            return clampPoint({ x, y });
        }

        function cropPointsToStage(points) {
            return Object.fromEntries(Object.entries(points).map(([name, point]) => [
                name,
                {
                    x: imageDisplayRect.left + point.x * imageDisplayRect.width,
                    y: imageDisplayRect.top + point.y * imageDisplayRect.height
                }
            ]));
        }

        function getCropHandles(points) {
            return [
                { name: 'tl', type: 'corner', ...points.tl },
                { name: 'tr', type: 'corner', ...points.tr },
                { name: 'br', type: 'corner', ...points.br },
                { name: 'bl', type: 'corner', ...points.bl },
                { name: 'top', type: 'edge', angle: edgeAngle(points.tl, points.tr), ...midpoint(points.tl, points.tr) },
                { name: 'right', type: 'edge', angle: edgeAngle(points.tr, points.br), ...midpoint(points.tr, points.br) },
                { name: 'bottom', type: 'edge', angle: edgeAngle(points.br, points.bl), ...midpoint(points.br, points.bl) },
                { name: 'left', type: 'edge', angle: edgeAngle(points.bl, points.tl), ...midpoint(points.bl, points.tl) }
            ];
        }

        function midpoint(a, b) {
            return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        }

        function edgeAngle(a, b) {
            return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        }

        function defaultCropPoints() {
            return {
                tl: { x: 0, y: 0 },
                tr: { x: 1, y: 0 },
                br: { x: 1, y: 1 },
                bl: { x: 0, y: 1 }
            };
        }

        function sanitizeCropPoints(points) {
            if (!points || !points.tl || !points.tr || !points.br || !points.bl) return null;
            const sanitized = {
                tl: clampPoint(points.tl),
                tr: clampPoint(points.tr),
                br: clampPoint(points.br),
                bl: clampPoint(points.bl)
            };
            return isValidCropPoints(sanitized) ? sanitized : null;
        }

        function cloneCropPoints(points) {
            return {
                tl: { ...points.tl },
                tr: { ...points.tr },
                br: { ...points.br },
                bl: { ...points.bl }
            };
        }

        function clampPoint(point) {
            return {
                x: Math.max(0, Math.min(1, point.x)),
                y: Math.max(0, Math.min(1, point.y))
            };
        }

        function isValidCropPoints(points) {
            const minArea = 0.01;
            if (Math.abs(polygonArea([points.tl, points.tr, points.br, points.bl])) < minArea) return false;
            if (segmentsIntersect(points.tl, points.tr, points.br, points.bl)) return false;
            if (segmentsIntersect(points.tr, points.br, points.bl, points.tl)) return false;
            return true;
        }

        function polygonArea(points) {
            return points.reduce((sum, point, i) => {
                const next = points[(i + 1) % points.length];
                return sum + point.x * next.y - next.x * point.y;
            }, 0) / 2;
        }

        function segmentsIntersect(a, b, c, d) {
            const ccw = (p1, p2, p3) => (p3.y - p1.y) * (p2.x - p1.x) > (p2.y - p1.y) * (p3.x - p1.x);
            return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
        }

        function normalizeRotateDegrees(value) {
            return ((Math.round(value / 90) * 90) % 360 + 360) % 360;
        }

        function animateRotateButton() {
            const rotateBtn = document.getElementById('rotate-btn');
            rotateBtn.classList.remove('rotate-tap');
            void rotateBtn.offsetWidth;
            rotateBtn.classList.add('rotate-tap');
        }

        function buildEditorSourceDataUrl(sourceDataUrl, rotateDegrees, straightenDegrees = 0) {
            const normalizedDegrees = normalizeRotateDegrees(rotateDegrees);
            const totalDegrees = normalizedDegrees + straightenDegrees;

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const radians = (totalDegrees * Math.PI) / 180;
                    const sin = Math.abs(Math.sin(radians));
                    const cos = Math.abs(Math.cos(radians));
                    const sourceScale = Math.min(1, MAX_IMAGE_SIZE / Math.max(img.width, img.height));
                    const drawWidth = Math.round(img.width * sourceScale);
                    const drawHeight = Math.round(img.height * sourceScale);
                    canvas.width = Math.ceil(drawWidth * cos + drawHeight * sin);
                    canvas.height = Math.ceil(drawWidth * sin + drawHeight * cos);

                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(radians);
                    ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    resolve(canvas.toDataURL('image/jpeg', 0.92));
                };
                img.onerror = reject;
                img.src = sourceDataUrl;
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderPerspectiveCrop(sourceDataUrl, points) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const srcPoints = ['tl', 'tr', 'br', 'bl'].map((name) => ({
                            x: points[name].x * img.width,
                            y: points[name].y * img.height
                        }));

                        const topWidth = distance(srcPoints[0], srcPoints[1]);
                        const bottomWidth = distance(srcPoints[3], srcPoints[2]);
                        const leftHeight = distance(srcPoints[0], srcPoints[3]);
                        const rightHeight = distance(srcPoints[1], srcPoints[2]);
                        let outputWidth = Math.max(1, Math.round(Math.max(topWidth, bottomWidth)));
                        let outputHeight = Math.max(1, Math.round(Math.max(leftHeight, rightHeight)));
                        const scale = Math.min(1, MAX_IMAGE_SIZE / Math.max(outputWidth, outputHeight));
                        outputWidth = Math.max(1, Math.round(outputWidth * scale));
                        outputHeight = Math.max(1, Math.round(outputHeight * scale));

                        const sourceCanvas = document.createElement('canvas');
                        sourceCanvas.width = img.width;
                        sourceCanvas.height = img.height;
                        const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
                        sourceCtx.drawImage(img, 0, 0);
                        const sourceData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);

                        const outputCanvas = document.createElement('canvas');
                        outputCanvas.width = outputWidth;
                        outputCanvas.height = outputHeight;
                        const outputCtx = outputCanvas.getContext('2d');
                        const outputData = outputCtx.createImageData(outputWidth, outputHeight);
                        const matrix = perspectiveMatrix(
                            [
                                { x: 0, y: 0 },
                                { x: outputWidth - 1, y: 0 },
                                { x: outputWidth - 1, y: outputHeight - 1 },
                                { x: 0, y: outputHeight - 1 }
                            ],
                            srcPoints
                        );

                        for (let y = 0; y < outputHeight; y++) {
                            for (let x = 0; x < outputWidth; x++) {
                                const sourcePoint = applyPerspective(matrix, x, y);
                                copyBilinearPixel(sourceData, outputData, sourcePoint.x, sourcePoint.y, x, y);
                            }
                        }

                        outputCtx.putImageData(outputData, 0, 0);
                        resolve({ dataUrl: outputCanvas.toDataURL('image/jpeg', 0.9), w: outputWidth, h: outputHeight });
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = reject;
                img.src = sourceDataUrl;
            });
        }

        function distance(a, b) {
            return Math.hypot(b.x - a.x, b.y - a.y);
        }

        function perspectiveMatrix(fromPoints, toPoints) {
            const rows = [];
            for (let i = 0; i < 4; i++) {
                const from = fromPoints[i];
                const to = toPoints[i];
                rows.push([from.x, from.y, 1, 0, 0, 0, -to.x * from.x, -to.x * from.y, to.x]);
                rows.push([0, 0, 0, from.x, from.y, 1, -to.y * from.x, -to.y * from.y, to.y]);
            }
            const solved = solveLinearSystem(rows);
            return [...solved, 1];
        }

        function solveLinearSystem(matrix) {
            const size = 8;
            for (let col = 0; col < size; col++) {
                let pivot = col;
                for (let row = col + 1; row < size; row++) {
                    if (Math.abs(matrix[row][col]) > Math.abs(matrix[pivot][col])) pivot = row;
                }
                [matrix[col], matrix[pivot]] = [matrix[pivot], matrix[col]];

                const divisor = matrix[col][col] || 1e-12;
                for (let item = col; item <= size; item++) matrix[col][item] /= divisor;

                for (let row = 0; row < size; row++) {
                    if (row === col) continue;
                    const factor = matrix[row][col];
                    for (let item = col; item <= size; item++) matrix[row][item] -= factor * matrix[col][item];
                }
            }
            return matrix.map((row) => row[size]);
        }

        function applyPerspective(matrix, x, y) {
            const denominator = matrix[6] * x + matrix[7] * y + matrix[8];
            return {
                x: (matrix[0] * x + matrix[1] * y + matrix[2]) / denominator,
                y: (matrix[3] * x + matrix[4] * y + matrix[5]) / denominator
            };
        }

        function copyBilinearPixel(sourceData, outputData, sourceX, sourceY, outputX, outputY) {
            const width = sourceData.width;
            const height = sourceData.height;
            const x = Math.max(0, Math.min(width - 1, sourceX));
            const y = Math.max(0, Math.min(height - 1, sourceY));
            const x0 = Math.floor(x);
            const y0 = Math.floor(y);
            const x1 = Math.min(width - 1, x0 + 1);
            const y1 = Math.min(height - 1, y0 + 1);
            const xWeight = x - x0;
            const yWeight = y - y0;
            const outIndex = (outputY * outputData.width + outputX) * 4;

            for (let channel = 0; channel < 4; channel++) {
                const topLeft = sourceData.data[(y0 * width + x0) * 4 + channel];
                const topRight = sourceData.data[(y0 * width + x1) * 4 + channel];
                const bottomLeft = sourceData.data[(y1 * width + x0) * 4 + channel];
                const bottomRight = sourceData.data[(y1 * width + x1) * 4 + channel];
                const top = topLeft + (topRight - topLeft) * xWeight;
                const bottom = bottomLeft + (bottomRight - bottomLeft) * xWeight;
                outputData.data[outIndex + channel] = top + (bottom - top) * yWeight;
            }
        }

        async function buildOriginalImageRecord(sourceDataUrl, originalName) {
            const rendered = await renderImageToJpeg(sourceDataUrl);
            return {
                ...rendered,
                originalDataUrl: sourceDataUrl,
                originalName: originalName || '',
                edit: {
                    cropPoints: null,
                    straighten: 0,
                    rotateDegrees: 0
                }
            };
        }

        function renderImageToJpeg(sourceDataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width;
                    let h = img.height;
                    if (w > MAX_IMAGE_SIZE || h > MAX_IMAGE_SIZE) {
                        if (w > h) {
                            h = Math.round((h * MAX_IMAGE_SIZE) / w);
                            w = MAX_IMAGE_SIZE;
                        } else {
                            w = Math.round((w * MAX_IMAGE_SIZE) / h);
                            h = MAX_IMAGE_SIZE;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), w, h });
                };
                img.onerror = reject;
                img.src = sourceDataUrl;
            });
        }

        // --- Main UI Rendering ---
        function updateUI() {
            grid.innerHTML = '';
            images.forEach((img, i) => {
                const div = document.createElement('div');
                // Removed specific tiny handle. The entire card is now the draggable target.
                div.className = "grid-item-card relative aspect-square bg-slate-100 rounded-2xl overflow-hidden shadow-sm border border-slate-200 cursor-grab active:cursor-grabbing group animate-in fade-in zoom-in duration-300";
                div.onclick = () => editImg(i);
                
                div.innerHTML = `
                    <img src="${img.dataUrl}" draggable="false" class="w-full h-full object-cover pointer-events-none select-none">
                    
                    <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white rounded-md px-2 py-0.5 text-[11px] font-black pointer-events-none select-none shadow-sm z-10">
                        ${i + 1}
                    </div>
                    <div class="absolute bottom-2 left-2 right-2 bg-black/50 backdrop-blur-md text-white rounded-md px-2 py-1 text-[9px] font-black uppercase tracking-widest pointer-events-none select-none text-center opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity z-10">
                        Edit
                    </div>
                    
                    <button onclick="event.stopPropagation(); removeImg(${i})" class="no-drag absolute top-2 right-2 bg-black/60 hover:bg-red-500 transition-colors text-white rounded-full w-8 h-8 flex items-center justify-center text-sm backdrop-blur-md shadow-sm z-20 active:scale-90">&times;</button>
                `;
                grid.appendChild(div);
            });
            
            const hasData = images.length > 0;
            document.getElementById('settings-area').classList.toggle('hidden', !hasData);
            document.getElementById('action-bar').classList.toggle('hidden', !hasData);
            document.getElementById('stats').innerText = `${images.length} PHOTO${images.length !== 1 ? 'S' : ''}`;

            // Contextual Drag Hint logic
            const subtext = document.getElementById('stats-subtext');
            if (images.length > 1) {
                subtext.innerText = "Tap to crop, rotate & straighten; hold to reorder";
                subtext.classList.add('text-indigo-600');
                subtext.classList.remove('text-slate-500');
            } else {
                subtext.innerText = "Tap photo to crop, rotate & straighten";
                subtext.classList.remove('text-indigo-600');
                subtext.classList.add('text-slate-500');
            }
        }

        function removeImg(i) { 
            images.splice(i, 1); 
            updateUI(); 
        }

        function openPreview() {
            modalPreview.classList.remove('hidden');
            modalPreview.classList.add('flex');
            setTimeout(() => modalPreview.classList.remove('translate-y-full'), 10);
            document.body.style.overflow = 'hidden';
            renderLivePreview();
        }

        function closePreview() {
            modalPreview.classList.add('translate-y-full');
            document.body.style.overflow = '';
            setTimeout(() => {
                modalPreview.classList.add('hidden');
                modalPreview.classList.remove('flex');
            }, 300);
        }

        function renderLivePreview() {
            scrollContainer.innerHTML = '';
            if (!images.length) {
                scrollContainer.innerHTML = `<p class="text-slate-400 font-bold mt-10">No photos to preview</p>`;
                return;
            }

            const fit = document.getElementById('setting-fit').value;
            const margin = parseInt(document.getElementById('setting-margin').value);
            
            images.forEach((img, index) => {
                const page = document.createElement('div');
                page.className = "bg-white shadow-2xl relative shrink-0 rounded-sm overflow-hidden";
                page.style.width = "280px"; 
                page.style.height = "396px"; 
                
                const inner = document.createElement('img');
                inner.src = img.dataUrl;
                inner.style.position = "absolute";
                
                const pMargin = (margin * 1.3) + "px"; 
                inner.style.top = inner.style.left = inner.style.right = inner.style.bottom = pMargin;
                inner.style.width = `calc(100% - ${(margin*2)*1.3}px)`;
                inner.style.height = `calc(100% - ${(margin*2)*1.3}px)`;
                
                if (fit === 'contain') inner.style.objectFit = "contain";
                else if (fit === 'stretch') inner.style.objectFit = "fill";
                else inner.style.objectFit = "cover";

                page.appendChild(inner);
                
                const pageNum = document.createElement('div');
                pageNum.className = "absolute bottom-[-30px] w-full text-center text-slate-500 font-bold text-xs tracking-widest";
                pageNum.innerText = `PAGE ${index + 1}`;
                page.appendChild(pageNum);

                scrollContainer.appendChild(page);
            });
        }

        async function generateAndSharePDF() {
            const btn = document.getElementById('modal-export-btn');
            const loader = document.getElementById('modal-loader');
            const fit = document.getElementById('setting-fit').value;
            const margin = parseInt(document.getElementById('setting-margin').value);

            btn.disabled = true; 
            loader.classList.remove('hidden');
            await new Promise(r => setTimeout(r, 50));

            try {
                const doc = new jsPDF({ format: 'a4', unit: 'mm' });
                
                for (let i = 0; i < images.length; i++) {
                    if (i > 0) doc.addPage();
                    const img = images[i];
                    const pW = doc.internal.pageSize.getWidth();
                    const pH = doc.internal.pageSize.getHeight();
                    const aW = pW - (margin * 2);
                    const aH = pH - (margin * 2);

                    let dW = aW, dH = (img.h * aW) / img.w;
                    
                    if (fit === 'contain' && dH > aH) { dH = aH; dW = (img.w * aH) / img.h; }
                    if (fit === 'stretch') { dW = aW; dH = aH; }
                    if (fit === 'cover' && dH < aH) { dH = aH; dW = (img.w * aH) / img.h; }

                    doc.addImage(img.dataUrl, 'JPEG', (pW-dW)/2, (pH-dH)/2, dW, dH, undefined, 'FAST');
                }

                const fileName = `PicToPDF_${Date.now()}.pdf`;
                const blob = doc.output('blob');
                const file = new File([blob], fileName, { type: 'application/pdf' });

                if (isDesktop) {
                    doc.save(fileName);
                    closePreview();
                } else {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ files: [file], title: 'PDF Export' });
                            closePreview(); 
                        } catch (err) {
                            console.log("Share cancelled or failed");
                        }
                    } else {
                        doc.save(fileName);
                    }
                }
            } catch (error) {
                console.error("PDF Generation Error", error);
                alert("An error occurred during export.");
            }

            btn.disabled = false; 
            loader.classList.add('hidden');
        }
    </script>
</body>
</html>
